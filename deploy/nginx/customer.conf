    # Customer app: Flutter web (base-href /customer/) published to /var/www/dev.coffeesos.online/customer
    # Flutter's main.dart.js / flutter_bootstrap.js are not content-hashed, so the
    # shell files stay no-cache; canvaskit and bundled assets can be cached.
    location = /customer {
        return 301 /customer/;
    }

    location /customer/canvaskit/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Manifests and the (hash-named) icon font: small, must never be stale.
    location /customer/assets/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location /customer/ {
        try_files $uri $uri/ /customer/index.html;
        add_header Cache-Control "no-cache";
    }

